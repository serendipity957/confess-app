<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 表白管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f0f3;
    min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; color: #d6336c; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #9a7a88; margin-bottom: 20px; }

  /* 统计卡片 */
  .stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat {
    flex: 1; background: #fff;
    border-radius: 14px; padding: 14px 10px; text-align: center;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .stat .num { font-size: 24px; font-weight: 700; color: #d6336c; }
  .stat .label { font-size: 12px; color: #9a7a88; margin-top: 4px; }

  /* 交流空间卡片 */
  .chat-box {
    background: #fff; border-radius: 16px;
    padding: 16px; margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .chat-box .chat-title {
    font-size: 15px; font-weight: 700; color: #d6336c;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px dashed #ffc2d4;
  }
  .chat-body {
    max-height: 260px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 2px 0;
  }
  .row { display: flex; flex-direction: column; }
  .row.me { align-items: flex-end; }
  .row.ta { align-items: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .row.ta .bubble { background: #ffe9f0; color: #5c3344; border-bottom-left-radius: 4px; }
  .row.me .bubble { background: linear-gradient(135deg, #ff6b9d, #d6336c); color: #fff; border-bottom-right-radius: 4px; }
  .mtime { font-size: 10px; color: #c9a7b8; margin-top: 3px; padding: 0 4px; }
  .chat-input { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input input {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 2px solid #ffc2d4; border-radius: 12px;
    font-size: 14px; font-family: inherit;
    color: #5c3344; background: #fff;
  }
  .chat-input input:focus { outline: none; border-color: #d6336c; }
  .chat-input button {
    padding: 10px 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  /* 留言卡片 */
  .item {
    background: #fff; border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .item-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .tag { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
  .tag-yes { background: #ffe0ea; color: #d6336c; }
  .tag-think { background: #fff0d6; color: #b07a2a; }
  .tag-crush { background: #e8e0f5; color: #7a4db8; }
  .time { font-size: 12px; color: #b9a2ad; }
  .crush-line {
    font-size: 13px; color: #7a4db8; font-weight: 600;
    background: #f1eafa; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 8px;
  }
  .msg {
    font-size: 14px; color: #5c3344;
    background: #fdf2f6; border-radius: 10px;
    padding: 10px 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    margin-bottom: 6px;
  }
  .msg.reply {
    background: #fff0f4;
    border-left: 3px solid #d6336c;
  }
  .msg .mwho { font-size: 11px; color: #b9a2ad; font-weight: 600; }
  .empty { text-align: center; color: #b9a2ad; font-size: 14px; padding: 40px 0; }

  /* 锁屏（输密码） */
  .lock {
    background: #fff; border-radius: 20px;
    padding: 36px 24px; text-align: center;
    box-shadow: 0 2px 14px rgba(214, 51, 108, 0.1);
    margin-top: 40px;
  }
  .lock .heart { font-size: 44px; }
  .lock h2 { font-size: 18px; color: #d6336c; margin: 12px 0 6px; }
  .lock p { font-size: 13px; color: #9a7a88; margin-bottom: 18px; }
  .lock input {
    width: 100%; padding: 14px;
    border: 2px solid #ffc2d4; border-radius: 14px;
    font-size: 16px; text-align: center; letter-spacing: 6px;
    font-family: inherit;
  }
  .lock input:focus { outline: none; border-color: #d6336c; }
  .lock button {
    margin-top: 12px; width: 100%;
    padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .lock .err { color: #e03131; font-size: 13px; margin-top: 10px; }
  .logout {
    display: inline-block; margin-top: 16px;
    font-size: 12px; color: #b9a2ad; text-decoration: none;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const ADMIN_PASSWORD = window.ADMIN_PASSWORD || "520520";
  const wrap = document.getElementById("wrap");

  // ===== 锁屏 =====
  function showLock() {
    wrap.innerHTML =
      '<div class="lock">' +
      '<div class="heart">🔒</div>' +
      '<h2>这是表白者的专属页面</h2>' +
      '<p>输入管理密码才能看 Ta 的回应</p>' +
      '<input type="password" id="pw" placeholder="管理密码" autocomplete="off">' +
      '<button onclick="checkPw()">查看留言</button>' +
      '<div class="err" id="pwErr"></div>' +
      '</div>';
    document.getElementById("pw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") checkPw();
    });
  }

  function checkPw() {
    const v = document.getElementById("pw").value;
    if (v === ADMIN_PASSWORD) {
      localStorage.setItem("confess_admin_ok", "1");
      loadDashboard();
    } else {
      document.getElementById("pwErr").textContent = "密码不对，再试试";
    }
  }

  function logout() {
    localStorage.removeItem("confess_admin_ok");
    showLock();
  }

  // ===== 已登录：数据看板 =====
  async function loadDashboard() {
    wrap.innerHTML = '<div class="empty">加载中…</div>';
    try {
      const [r1, r2, r3] = await Promise.all([
        sb.from("chat").select("*").order("id", { ascending: true }),
        sb.from("records").select("*").order("time", { ascending: false }),
        sb.from("messages").select("*").order("id", { ascending: true })
      ]);
      if (r1.error) throw r1.error;
      if (r2.error) throw r2.error;
      if (r3.error) throw r3.error;

      const chat = r1.data || [];
      const records = r2.data || [];
      const messages = r3.data || [];

      // 统计
      const stats = {
        total: records.length,
        yes: records.filter(r => r.choice === "我愿意").length,
        think: records.filter(r => r.choice === "让我再想想").length,
        crush: records.filter(r => r.choice === "有喜欢的人了" || r.choice === "还是做朋友吧").length
      };

      // 交流空间 HTML
      let chatHtml = "";
      if (chat.length === 0) {
        chatHtml = '<div style="text-align:center;color:#b9a2ad;font-size:13px;padding:16px 0;">还没有消息，把交流空间链接发给 Ta 💌</div>';
      } else {
        chat.forEach(function (m) {
          const me = m.who === "me";
          chatHtml += '<div class="row ' + (me ? "me" : "ta") + '">' +
            '<div class="bubble">' + esc(m.text || "") + '</div>' +
            '<div class="mtime">' + (m.time ? m.time.slice(11, 16) : "") + '</div></div>';
        });
      }

      // 记录卡片 HTML
      let itemsHtml = "";
      if (records.length === 0) {
        itemsHtml = '<div class="empty">还没有人回应，把表白页链接发给她吧 💌</div>';
      } else {
        records.forEach(function (r) {
          let tag = "";
          if (r.choice === "有喜欢的人了") {
            tag = '<span class="tag tag-crush">💔 有喜欢的人了</span>';
          } else if (r.choice === "还是做朋友吧") {
            tag = '<span class="tag tag-crush">🤝 还是做朋友吧</span>';
          } else if (r.choice === "我愿意") {
            tag = '<span class="tag tag-yes">我愿意</span>';
          } else {
            tag = '<span class="tag tag-think">让我再想想</span>';
          }
          let body = "";
          if (r.crush) {
            body += '<div class="crush-line">💘 Ta 喜欢的人：' + esc(r.crush) + '</div>';
          }
          // 该记录下的所有消息（含回复）
          const msgs = messages.filter(m => m.record_id === r.id);
          msgs.forEach(function (m) {
            const cls = m.who === "me" ? "reply" : "";
            const who = m.who === "me" ? "我" : "Ta";
            body += '<div class="msg ' + cls + '">' +
                    '<div class="mwho">' + who + ' · ' + (m.time || "") + '</div>' +
                    esc(m.text || "") + '</div>';
          });
          if (r.contact) {
            body += '<div class="crush-line" style="background:#e6f7ee;color:#2f9e44;">💌 Ta 的联系方式：' + esc(r.contact) + '</div>';
          }
          itemsHtml += '<div class="item"><div class="item-head">' + tag +
            '<span class="time">' + esc(r.time || "") + '</span></div>' + body + '</div>';
        });
      }

      wrap.innerHTML =
        '<h1>💌 表白管理</h1>' +
        '<p class="sub">交流空间在确认前用；确认通过主页按钮</p>' +
        '<div class="chat-box">' +
          '<div class="chat-title">💬 交流空间</div>' +
          '<div class="chat-body" id="chatBody">' + chatHtml + '</div>' +
          '<div class="chat-input">' +
            '<input id="chatReply" type="text" placeholder="回复 Ta…" maxlength="500">' +
            '<button onclick="sendChatReply()">回复</button>' +
          '</div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="num">' + stats.yes + '</div><div class="label">愿意</div></div>' +
          '<div class="stat"><div class="num">' + stats.think + '</div><div class="label">再想想</div></div>' +
          '<div class="stat"><div class="num">' + stats.crush + '</div><div class="label">拒绝</div></div>' +
        '</div>' +
        itemsHtml +
        '<div style="text-align:center;"><a class="logout" href="javascript:logout()">退出登录</a></div>';

      document.getElementById("chatReply").addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendChatReply();
      });
    } catch (e) {
      wrap.innerHTML = '<div class="empty">加载失败：' + esc(e.message || "检查网络") + '</div>';
    }
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function now() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  async function sendChatReply() {
    const input = document.getElementById("chatReply");
    const text = input.value.trim();
    if (!text) {
      alert("先写点回复内容");
      return;
    }
    try {
      const { error } = await sb.from("chat").insert({ who: "me", text: text, time: now() });
      if (error) {
        alert("回复失败：" + (error.message || "未知原因"));
        return;
      }
      input.value = "";
      loadDashboard();
    } catch (e) {
      alert("发送失败，检查网络");
    }
  }

  // ===== 启动 =====
  if (localStorage.getItem("confess_admin_ok") === "1") {
    loadDashboard();
    setInterval(loadDashboard, 8000);
  } else {
    showLock();
  }
</script>
</body>
</html>
