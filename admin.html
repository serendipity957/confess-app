<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 表白管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f0f3;
    min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; color: #d6336c; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #9a7a88; margin-bottom: 20px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .head-row h1 { margin: 0; }
  .refresh-btn {
    flex-shrink: 0; background: #fff; border: 1px solid #ffb3c6;
    color: #d6336c; border-radius: 20px; padding: 7px 15px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .refresh-btn:active { background: #ffe3ea; }

  /* 统计卡片 */
  .stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat {
    flex: 1; background: #fff;
    border-radius: 14px; padding: 14px 10px; text-align: center;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .stat .num { font-size: 24px; font-weight: 700; color: #d6336c; }
  .stat .label { font-size: 12px; color: #9a7a88; margin-top: 4px; }

  /* 交流空间卡片 */
  .chat-box {
    background: #fff; border-radius: 16px;
    padding: 16px; margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .chat-box .chat-title {
    font-size: 15px; font-weight: 700; color: #d6336c;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px dashed #ffc2d4;
  }
  .chat-body {
    max-height: 260px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 2px 0;
  }
  .row { display: flex; flex-direction: column; }
  .row.me { align-items: flex-end; }
  .row.ta { align-items: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .row.ta .bubble { background: #ffe9f0; color: #5c3344; border-bottom-left-radius: 4px; }
  .row.me .bubble { background: linear-gradient(135deg, #ff6b9d, #d6336c); color: #fff; border-bottom-right-radius: 4px; }
  .mtime { font-size: 10px; color: #c9a7b8; margin-top: 3px; padding: 0 4px; }
  .chat-input { display: flex; gap: 8px; margin-top: 12px; position: relative; }
  .chat-input input {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 2px solid #ffc2d4; border-radius: 12px;
    font-size: 14px; font-family: inherit;
    color: #5c3344; background: #fff;
  }
  .chat-input input:focus { outline: none; border-color: #d6336c; }
  .chat-input button {
    padding: 10px 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .emoji-btn {
    padding: 8px 11px;
    border: 2px solid #ffc2d4; border-radius: 12px;
    background: #fff; font-size: 20px; line-height: 1;
    cursor: pointer; flex-shrink: 0;
  }
  .emoji-btn:hover { background: #ffe9f0; }
  .emoji-panel {
    position: absolute; bottom: 56px; left: 0; right: 0;
    background: #fff;
    border: 2px solid #ffc2d4; border-radius: 14px;
    padding: 8px; max-height: 210px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(214, 51, 108, 0.18);
    z-index: 20; display: none;
  }
  .emoji-panel.show { display: grid; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 2px;
  }
  .emoji-item {
    width: 36px; height: 36px;
    font-size: 21px;
    border: none; background: transparent; border-radius: 8px;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .emoji-item:hover { background: #ffe9f0; }

  /* 留言卡片 */
  .item {
    background: #fff; border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(214, 51, 108, 0.08);
  }
  .item-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .tag { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
  .tag-yes { background: #ffe0ea; color: #d6336c; }
  .tag-think { background: #fff0d6; color: #b07a2a; }
  .tag-crush { background: #e8e0f5; color: #7a4db8; }
  .time { font-size: 12px; color: #b9a2ad; }
  .crush-line {
    font-size: 13px; color: #7a4db8; font-weight: 600;
    background: #f1eafa; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 8px;
  }
  .msg {
    font-size: 14px; color: #5c3344;
    background: #fdf2f6; border-radius: 10px;
    padding: 10px 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    margin-bottom: 6px;
  }
  .msg.reply {
    background: #fff0f4;
    border-left: 3px solid #d6336c;
  }
  .msg .mwho { font-size: 11px; color: #b9a2ad; font-weight: 600; }
  .empty { text-align: center; color: #b9a2ad; font-size: 14px; padding: 40px 0; }

  /* 折叠展开 + 删除 */
  .toggle-detail {
    margin-top: 10px; width: 100%;
    background: #fff7fa; border: 1px dashed #ffb3c6;
    color: #d6336c; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .toggle-detail:hover { background: #ffe9f0; }
  .rec-detail { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .rec-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fdf2f6; border-radius: 8px; padding: 7px 10px;
  }
  .rec-time { font-size: 12px; color: #9a7a88; }
  .del-one {
    background: #fff; border: 1px solid #ffb3c6; color: #e03131;
    border-radius: 8px; padding: 4px 10px; font-size: 12px;
    cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .del-one:hover { background: #ffe3ea; }
  .del-single { margin-top: 10px; padding: 7px 12px; }
  .del-all {
    margin-top: 4px;
    background: #fff0f0; border: 1px solid #ffa8a8; color: #e03131;
    border-radius: 8px; padding: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .del-all:hover { background: #ffe0e0; }

  /* 锁屏（输密码） */
  .lock {
    background: #fff; border-radius: 20px;
    padding: 36px 24px; text-align: center;
    box-shadow: 0 2px 14px rgba(214, 51, 108, 0.1);
    margin-top: 40px;
  }
  .lock .heart { font-size: 44px; }
  .lock h2 { font-size: 18px; color: #d6336c; margin: 12px 0 6px; }
  .lock p { font-size: 13px; color: #9a7a88; margin-bottom: 18px; }
  .lock input {
    width: 100%; padding: 14px;
    border: 2px solid #ffc2d4; border-radius: 14px;
    font-size: 16px; text-align: center; letter-spacing: 6px;
    font-family: inherit;
  }
  .lock input:focus { outline: none; border-color: #d6336c; }
  .lock button {
    margin-top: 12px; width: 100%;
    padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .lock .err { color: #e03131; font-size: 13px; margin-top: 10px; }
  .logout {
    display: inline-block; margin-top: 16px;
    font-size: 12px; color: #b9a2ad; text-decoration: none;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const ADMIN_PASSWORD = window.ADMIN_PASSWORD || "520520";
  const wrap = document.getElementById("wrap");
  const expandedGroups = {}; // 记录展开的分组（自动刷新时保持展开）

  // ===== 锁屏 =====
  function showLock() {
    wrap.innerHTML =
      '<div class="lock">' +
      '<div class="heart">🔒</div>' +
      '<h2>这是表白者的专属页面</h2>' +
      '<p>输入管理密码才能看 Ta 的回应</p>' +
      '<input type="password" id="pw" placeholder="管理密码" autocomplete="off">' +
      '<button onclick="checkPw()">查看留言</button>' +
      '<div class="err" id="pwErr"></div>' +
      '</div>';
    document.getElementById("pw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") checkPw();
    });
  }

  function checkPw() {
    const v = document.getElementById("pw").value;
    if (v === ADMIN_PASSWORD) {
      localStorage.setItem("confess_admin_ok", "1");
      loadDashboard();
    } else {
      document.getElementById("pwErr").textContent = "密码不对，再试试";
    }
  }

  function logout() {
    localStorage.removeItem("confess_admin_ok");
    showLock();
  }

  // ===== 已登录：数据看板 =====
  async function loadDashboard() {
    wrap.innerHTML = '<div class="empty">加载中…</div>';
    try {
      const [r1, r2, r3] = await Promise.all([
        sb.from("chat").select("*").order("id", { ascending: true }),
        sb.from("records").select("*").order("time", { ascending: false }),
        sb.from("messages").select("*").order("id", { ascending: true })
      ]);
      if (r1.error) throw r1.error;
      if (r2.error) throw r2.error;
      if (r3.error) throw r3.error;

      const chat = r1.data || [];
      const records = r2.data || [];
      const messages = r3.data || [];

      // 统计
      const stats = {
        total: records.length,
        yes: records.filter(r => r.choice === "我愿意").length,
        think: records.filter(r => r.choice === "让我再想想").length,
        crush: records.filter(r => r.choice === "有喜欢的人了" || r.choice === "还是做朋友吧").length
      };

      // 交流空间 HTML
      let chatHtml = "";
      if (chat.length === 0) {
        chatHtml = '<div style="text-align:center;color:#b9a2ad;font-size:13px;padding:16px 0;">还没有消息，把交流空间链接发给 Ta 💌</div>';
      } else {
        chat.forEach(function (m) {
          const me = m.who === "me";
          chatHtml += '<div class="row ' + (me ? "me" : "ta") + '">' +
            '<div class="bubble">' + esc(m.text || "") + '</div>' +
            '<div class="mtime">' + (m.time ? m.time.slice(11, 16) : "") + '</div></div>';
        });
      }

      // 记录卡片 HTML（相同选择折叠合并，可展开看每次时间、可删除）
      let itemsHtml = "";
      if (records.length === 0) {
        itemsHtml = '<div class="empty">还没有人回应，把表白页链接发给她吧 💌</div>';
      } else {
        // 按「选择 + 喜欢的人 + 联系方式」分组
        const groups = [];
        const seen = {};
        records.forEach(function (r) {
          const key = r.choice + "|" + (r.crush || "") + "|" + (r.contact || "");
          if (!seen[key]) { seen[key] = { list: [] }; groups.push(seen[key]); }
          seen[key].list.push(r);
        });
        groups.forEach(function (g) {
          g.list.sort(function (a, b) { return (b.time || "").localeCompare(a.time || ""); });
        });
        // 顺序：我愿意 > 再想想 > 有喜欢的人 > 做朋友；同级再按时间新→旧
        const choiceRank = { "我愿意": 0, "让我再想想": 1, "有喜欢的人了": 2, "还是做朋友吧": 3 };
        groups.sort(function (a, b) {
          const ra = (choiceRank[a.list[0].choice] !== undefined) ? choiceRank[a.list[0].choice] : 9;
          const rb = (choiceRank[b.list[0].choice] !== undefined) ? choiceRank[b.list[0].choice] : 9;
          if (ra !== rb) return ra - rb;
          return (b.list[0].time || "").localeCompare(a.list[0].time || "");
        });

        groups.forEach(function (g) {
          const list = g.list;
          const r = list[0]; // 最新一条为代表
          let tagTxt = "", clsTag = "tag tag-think";
          if (r.choice === "有喜欢的人了") { tagTxt = "💔 有喜欢的人了"; clsTag = "tag tag-crush"; }
          else if (r.choice === "还是做朋友吧") { tagTxt = "🤝 还是做朋友吧"; clsTag = "tag tag-crush"; }
          else if (r.choice === "我愿意") { tagTxt = "我愿意"; clsTag = "tag tag-yes"; }
          else { tagTxt = "让我再想想"; }
          if (list.length > 1) tagTxt += " ×" + list.length;
          const tag = '<span class="' + clsTag + '">' + tagTxt + '</span>';

          let body = "";
          if (r.crush) {
            body += '<div class="crush-line">💘 Ta 喜欢的人：' + esc(r.crush) + '</div>';
          }
          if (r.contact) {
            body += '<div class="crush-line" style="background:#e6f7ee;color:#2f9e44;">💌 Ta 的联系方式：' + esc(r.contact) + '</div>';
          }
          // 组内留言（重复的只显示一条）
          const ids = list.map(x => x.id);
          const msgs = messages.filter(m => ids.indexOf(m.record_id) !== -1);
          const seenMsg = {};
          msgs.forEach(function (m) {
            const mk = m.who + "|" + m.text + "|" + m.time;
            if (seenMsg[mk]) return;
            seenMsg[mk] = true;
            const cls = m.who === "me" ? "reply" : "";
            const who = m.who === "me" ? "我" : "Ta";
            body += '<div class="msg ' + cls + '">' +
                    '<div class="mwho">' + who + ' · ' + (m.time || "") + '</div>' +
                    esc(m.text || "") + '</div>';
          });

          // 展开区：每次记录的时间 + 删除按钮
          const gkey = r.choice + "|" + (r.crush || "") + "|" + (r.contact || "");
          const isOpen = !!expandedGroups[gkey];
          let detail = "";
          if (list.length > 1) {
            let rows = "";
            list.forEach(function (one) {
              rows += '<div class="rec-row"><span class="rec-time">🕐 ' + esc(one.time || "") + '</span>' +
                      '<button class="del-one" onclick="deleteRecord(\'' + one.id + '\')">删除</button></div>';
            });
            detail = '<button class="toggle-detail" data-n="' + list.length + '" data-key="' + esc(gkey) + '" onclick="toggleDetail(this)">' +
                     (isOpen ? "▾ 收起" : "▸ 展开 " + list.length + " 条记录") + '</button>' +
                     '<div class="rec-detail" style="display:' + (isOpen ? "block" : "none") + ';">' + rows +
                     '<button class="del-all" onclick="deleteGroup(\'' + list.map(x => x.id).join(",") + '\')">🗑 删除整组（' + list.length + ' 条）</button></div>';
          } else {
            detail = '<button class="del-one del-single" onclick="deleteRecord(\'' + r.id + '\')">🗑 删除这条</button>';
          }

          itemsHtml += '<div class="item"><div class="item-head">' + tag +
            '<span class="time">' + esc(r.time || "") + '</span></div>' + body + detail + '</div>';
        });
      }

      wrap.innerHTML =
        '<div class="head-row"><h1>💌 表白管理</h1>' +
        '<button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 刷新</button></div>' +
        '<p class="sub">交流空间在确认前用；确认通过主页按钮（每 10 秒自动刷新）</p>' +
        '<div class="chat-box">' +
          '<div class="chat-title">💬 交流空间</div>' +
          '<div class="chat-body" id="chatBody">' + chatHtml + '</div>' +
          '<div class="chat-input">' +
            '<div class="emoji-panel" id="emojiPanel"><div class="emoji-grid" id="emojiGrid"></div></div>' +
            '<input id="chatReply" type="text" placeholder="回复 Ta…" maxlength="500">' +
            '<button class="emoji-btn" onclick="toggleEmoji(event)" type="button">😊</button>' +
            '<button onclick="sendChatReply()">回复</button>' +
          '</div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="num">' + stats.yes + '</div><div class="label">愿意</div></div>' +
          '<div class="stat"><div class="num">' + stats.think + '</div><div class="label">再想想</div></div>' +
          '<div class="stat"><div class="num">' + stats.crush + '</div><div class="label">拒绝</div></div>' +
        '</div>' +
        itemsHtml +
        '<div style="text-align:center;"><a class="logout" href="javascript:logout()">退出登录</a></div>';

      document.getElementById("chatReply").addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendChatReply();
      });
      buildEmojiPanel();
    } catch (e) {
      wrap.innerHTML = '<div class="empty">加载失败：' + esc(e.message || "检查网络") + '</div>';
    }
  }

  // ===== 表情选择（与交流空间同款） =====

  function buildEmojiPanel() {
    const grid = document.getElementById("emojiGrid");
    if (!grid) return;
    grid.innerHTML = "";
    EMOJIS.forEach(function (e) {
      const b = document.createElement("button");
      b.className = "emoji-item";
      b.textContent = e;
      b.type = "button";
      b.onclick = function () { insertEmoji(e); };
      grid.appendChild(b);
    });
  }

  function toggleEmoji(ev) {
    ev.stopPropagation();
    document.getElementById("emojiPanel").classList.toggle("show");
  }

  function insertEmoji(e) {
    const input = document.getElementById("chatReply");
    if (!input) return;
    const start = input.selectionStart || input.value.length;
    const end = input.selectionEnd || input.value.length;
    input.value = input.value.slice(0, start) + e + input.value.slice(end);
    const pos = start + e.length;
    input.setSelectionRange(pos, pos);
    input.focus();
  }

  // 点面板外面关闭表情面板
  document.addEventListener("click", function (e) {
    const p = document.getElementById("emojiPanel");
    if (p && !e.target.closest(".emoji-btn") && !e.target.closest(".emoji-panel")) {
      p.classList.remove("show");
    }
  });

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function now() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  // 展开 / 收起某组重复记录
  function toggleDetail(btn) {
    const d = btn.nextElementSibling;
    const n = btn.getAttribute("data-n");
    const k = btn.getAttribute("data-key");
    const open = d.style.display !== "none";
    d.style.display = open ? "none" : "block";
    btn.textContent = open ? ("▸ 展开 " + n + " 条记录") : "▾ 收起";
    if (open) { delete expandedGroups[k]; } else { expandedGroups[k] = true; }
  }

  // 删除单条记录（连同它的留言）
  async function deleteRecord(id) {
    if (!confirm("确定删除这条记录吗？\n删除后云端也会移除，不可恢复。")) return;
    try {
      await sb.from("messages").delete().eq("record_id", id);
      const { error } = await sb.from("records").delete().eq("id", id);
      if (error) { alert("删除失败：" + (error.message || "未知原因")); return; }
      loadDashboard();
    } catch (e) {
      alert("删除失败，检查网络");
    }
  }

  // 删除整组重复记录
  async function deleteGroup(idListStr) {
    const ids = idListStr.split(",");
    if (!confirm("确定删除整组 " + ids.length + " 条记录吗？\n删除后云端也会移除，不可恢复。")) return;
    try {
      for (const id of ids) {
        await sb.from("messages").delete().eq("record_id", id);
        const { error } = await sb.from("records").delete().eq("id", id);
        if (error) { alert("删除失败：" + (error.message || "未知原因")); return; }
      }
      loadDashboard();
    } catch (e) {
      alert("删除失败，检查网络");
    }
  }

  async function sendChatReply() {
    const input = document.getElementById("chatReply");
    const text = input.value.trim();
    if (!text) {
      alert("先写点回复内容");
      return;
    }
    try {
      const { error } = await sb.from("chat").insert({ who: "me", text: text, time: now() });
      if (error) {
        alert("回复失败：" + (error.message || "未知原因"));
        return;
      }
      input.value = "";
      loadDashboard();
    } catch (e) {
      alert("发送失败，检查网络");
    }
  }

  // 手动刷新（与 10 秒自动刷新互不冲突）
  let refreshing = false;
  async function manualRefresh() {
    if (refreshing) return;
    refreshing = true;
    const btn = document.getElementById("refreshBtn");
    if (btn) btn.textContent = "⏳ 刷新中…";
    await loadDashboard();
    const b = document.getElementById("refreshBtn");
    if (b) {
      b.textContent = "✅ 已刷新";
      setTimeout(function () {
        const bb = document.getElementById("refreshBtn");
        if (bb) bb.textContent = "🔄 刷新";
      }, 1200);
    }
    refreshing = false;
  }

  // ===== 启动 =====
  if (localStorage.getItem("confess_admin_ok") === "1") {
    loadDashboard();
    setInterval(loadDashboard, 10000);
  } else {
    showLock();
  }
</script>
