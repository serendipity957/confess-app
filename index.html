<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 有句话想对你说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffe3ec 0%, #ffc9d9 50%, #ffd6e0 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-x: hidden;
  }
  .card {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 36px 26px;
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(214, 51, 108, 0.18);
    position: relative; z-index: 2;
  }
  .big-heart {
    font-size: 84px; line-height: 1;
    display: inline-block;
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(214, 51, 108, 0.35));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
  h1 { font-size: 26px; color: #d6336c; margin: 18px 0 10px; font-weight: 700; }
  .sub { font-size: 14px; color: #8a4a63; line-height: 1.7; margin-bottom: 22px; }

  .btn-group { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    border: none; border-radius: 16px;
    padding: 16px; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); }
  .btn-yes {
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff;
    box-shadow: 0 6px 18px rgba(214, 51, 108, 0.35);
  }
  .btn-think {
    background: #fff; color: #d6336c;
    border: 2px solid #ffb3c8;
  }
  .btn-crush {
    background: #fff; color: #8a4a63;
    border: 2px solid #d3b8c4;
  }
  .btn-friend {
    background: #fff; color: #b07a2a;
    border: 2px solid #e8cf9a;
  }
  .btn-wait {
    background: #fff; color: #6b7280;
    border: 2px solid #d1d5db;
  }

  .btn-send {
    margin-top: 12px; width: 100%;
    background: #fff; color: #d6336c;
    border: 2px solid #d6336c;
  }
  .tip { font-size: 12px; color: #b07a8f; margin-top: 16px; }

  /* 飘浮小爱心 */
  .float-heart {
    position: fixed; bottom: -40px;
    font-size: 20px; opacity: 0.7;
    animation: floatUp linear infinite;
    z-index: 1; pointer-events: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; }
  }

  /* 顶部提示 */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #d6336c; color: #fff;
    padding: 12px 22px; border-radius: 30px;
    font-size: 15px; z-index: 10;
    opacity: 0; transition: opacity 0.3s;
    box-shadow: 0 6px 20px rgba(214, 51, 108, 0.4);
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.ok { background: #2f9e44; }
</style>
</head>
<body>

<div class="card">
  <span class="big-heart">❤️</span>
  <h1>我喜欢你</h1>
  <p class="sub">也许你还不知道我是谁，<br>但喜欢你这件事，已经悄悄藏了很久。<br>现在鼓起勇气告诉你，想听听你的回答。</p>

  <div class="btn-group">
    <button class="btn btn-yes" onclick="respond('我愿意')">我愿意 💕</button>
    <button class="btn btn-crush" onclick="openCrush()">💔 我有喜欢的人了</button>
    <button class="btn btn-wait" onclick="respond('让我再想想', false, '', '我还没想好，想好了再联系 😶')">😶 我还没想好</button>
    <button class="btn btn-friend" onclick="respond('还是做朋友吧', false, '', '还是做朋友吧 🤝')">🤝 还是做朋友吧</button>
  </div>

  <!-- 有喜欢的人：追问喜欢谁（可选） -->
  <div id="crush-box" style="display:none;margin-top:14px;text-align:left;">
    <p style="font-size:13px;color:#8a4a63;margin-bottom:8px;">如果愿意的话，可以告诉我你喜欢的人是谁——写缩写也可以，不想说就算了 💖</p>
    <input id="crush" type="text" placeholder="Ta 的名字或缩写…" style="width:100%;padding:12px;border:2px solid #ffc2d4;border-radius:14px;font-size:15px;font-family:inherit;color:#5c3344;background:rgba(255,255,255,0.85);box-sizing:border-box;">
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn btn-send" style="flex:1;" onclick="sendCrush()">告诉 Ta 💌</button>
      <button class="btn btn-think" style="flex:1;" onclick="sendCrush(true)">不想说，就这样</button>
    </div>
  </div>

  <div id="talk-area" style="margin-top:18px;border-top:1px dashed #ffc2d4;padding-top:14px;">
    <p style="font-size:12px;color:#b07a8f;margin-bottom:10px;">还没想好？可以先聊聊</p>
    <!-- 去交流空间 -->
    <button class="btn btn-send" onclick="location.href='chat.html'">💬 去交流空间聊聊</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  // 飘浮小爱心（装饰）
  for (let i = 0; i < 12; i++) {
    const h = document.createElement("div");
    h.className = "float-heart";
    h.textContent = ["💗", "💖", "💘", "💝", "❤️"][i % 5];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (14 + Math.random() * 20) + "px";
    h.style.animationDuration = (6 + Math.random() * 8) + "s";
    h.style.animationDelay = (-Math.random() * 10) + "s";
    document.body.appendChild(h);
  }

  function showToast(text, ok) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.className = "toast show" + (ok ? " ok" : "");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  // 生成记录 id（10 位随机）
  function genId() {
    let s = "";
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function now() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  // 有喜欢的人了：展开"喜欢的人是谁"追问（可选）
  function openCrush() {
    document.getElementById("crush-box").style.display = "block";
    // 点了确认按钮，交流空间入口就隐藏
    hideTalk();
    document.getElementById("crush-box").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // 隐藏"确认前的聊聊"区域
  function hideTalk() {
    var area = document.getElementById("talk-area");
    if (area) area.style.display = "none";
  }

  // 发送"有喜欢的人了"回应；skip=true 表示不想说喜欢谁
  async function sendCrush(skip) {
    const crush = skip ? "" : document.getElementById("crush").value.trim();
    await respond("有喜欢的人了", false, crush, "");
    document.getElementById("crush").value = "";
    document.getElementById("crush-box").style.display = "none";
  }

  // 提交回应：choice 必选。成功后跳转到对应结果页（带记录 id，可看回复）
  async function respond(choice, withMessage, crush, extraMsg) {
    const message = extraMsg !== undefined ? extraMsg : "";
    try {
      const id = genId();
      const { data, error } = await sb.from("records").insert({
        id: id,
        time: now(),
        choice: choice,
        crush: crush || "",
        contact: ""
      });
      if (error) {
        showToast("发送失败：" + (error.message || "未知原因"), false);
        return false;
      }
      // 如果有附带消息（做朋友/再想想的默认话），存进 messages 表
      if (message) {
        await sb.from("messages").insert({ record_id: id, who: "ta", text: message, time: now() });
      }
      if (choice === "我愿意") {
        showToast("收到啦！这句话我等了很久 💕", true);
        setTimeout(() => { window.location.href = "celebrate.html?id=" + id; }, 1200);
      } else if (choice === "有喜欢的人了") {
        showToast("知道了，谢谢你的坦诚 💔", true);
        setTimeout(() => { window.location.href = "result.html?choice=" + encodeURIComponent("有喜欢的人了") + "&id=" + id; }, 1200);
      } else if (choice === "还是做朋友吧") {
        showToast("好，听你的，做朋友 🤝", true);
        setTimeout(() => { window.location.href = "result.html?choice=" + encodeURIComponent("还是做朋友吧") + "&id=" + id; }, 1200);
      } else {
        showToast("收到啦，这个页面会一直留着，想好了随时回来 🤗", true);
        setTimeout(() => { window.location.href = "result.html?choice=" + encodeURIComponent("让我再想想") + "&id=" + id; }, 1200);
      }
      return true;
    } catch (e) {
      showToast("发送失败，检查下网络", false);
      return false;
    }
  }
</script>
</body>
</html>
