<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 交流空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff3f6 0%, #ffe9ef 50%, #f6eefb 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .chat-card {
    max-width: 440px; width: 100%;
    background: rgba(255,255,255,0.9);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(214, 51, 108, 0.14);
    display: flex; flex-direction: column;
    min-height: 70vh;
  }
  .head {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 1px dashed #ffc2d4;
  }
  .head .title { font-size: 20px; font-weight: 700; color: #d6336c; }
  .head .sub { font-size: 12px; color: #b07a8f; margin-top: 4px; }
  .body {
    flex: 1;
    max-height: 52vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 14px 2px;
  }
  .row { display: flex; flex-direction: column; }
  .row.me { align-items: flex-end; }
  .row.ta { align-items: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .row.ta .bubble { background: #ffe9f0; color: #5c3344; border-bottom-left-radius: 4px; }
  .row.me .bubble { background: linear-gradient(135deg, #ff6b9d, #d6336c); color: #fff; border-bottom-right-radius: 4px; }
  .mtime { font-size: 10px; color: #c9a7b8; margin-top: 3px; padding: 0 4px; }
  .empty { text-align: center; color: #c9a7b8; font-size: 13px; padding: 30px 10px; }
  .input-row {
    display: flex; gap: 8px; margin-top: 12px;
    border-top: 1px dashed #ffc2d4; padding-top: 12px;
    position: relative;
  }
  .emoji-btn {
    padding: 8px 11px;
    border: 2px solid #ffc2d4; border-radius: 14px;
    background: #fff; font-size: 20px; line-height: 1;
    cursor: pointer; flex-shrink: 0;
  }
  .emoji-btn:hover { background: #ffe9f0; }
  .emoji-panel {
    position: absolute; bottom: 60px; left: 0; right: 0;
    background: #fff;
    border: 2px solid #ffc2d4; border-radius: 14px;
    padding: 8px; max-height: 210px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(214, 51, 108, 0.18);
    z-index: 10; display: none;
  }
  .emoji-panel.show { display: grid; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 2px;
  }
  .emoji-item {
    width: 36px; height: 36px;
    font-size: 21px; line-height: 36px;
    border: none; background: transparent; border-radius: 8px;
    cursor: pointer; padding: 0; text-align: center;
  }
  .emoji-item:hover { background: #ffe9f0; }
  .input-row input {
    flex: 1; min-width: 0;
    padding: 11px 13px;
    border: 2px solid #ffc2d4; border-radius: 14px;
    font-size: 14px; font-family: inherit;
    color: #5c3344; background: #fff;
  }
  .input-row input:focus { outline: none; border-color: #d6336c; }
  .input-row button {
    padding: 11px 18px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .foot {
    text-align: center; font-size: 11px; color: #c9a7b8;
    margin-top: 12px;
  }
  .foot a { color: #d6336c; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="chat-card">
  <div class="head">
    <div class="title">💬 交流空间</div>
    <div class="sub">确认之前，想说什么都可以在这里说</div>
  </div>

  <div class="body" id="chatBody">
    <div class="empty">加载中…</div>
  </div>

  <div class="input-row">
    <button class="emoji-btn" onclick="toggleEmoji(event)" type="button">😊</button>
    <div class="emoji-panel" id="emojiPanel"><div class="emoji-grid" id="emojiGrid"></div></div>
    <input id="chatText" type="text" placeholder="想说什么都可以…" maxlength="500">
    <button onclick="sendChat()">发送 💌</button>
  </div>

  <div class="foot">
    想好之后，回主页点按钮告诉 Ta 你的答案
    <br><a href="index.html">← 回表白主页</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  function now() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  async function loadChat() {
    try {
      const { data, error } = await sb.from("chat").select("*").order("id", { ascending: true });
      if (error) throw error;
      const body = document.getElementById("chatBody");
      const last = body.scrollTop + body.clientHeight >= body.scrollHeight - 30;
      if (!data || data.length === 0) {
        body.innerHTML = '<div class="empty">这里还没有消息，说点什么吧 💌</div>';
        return;
      }
      body.innerHTML = "";
      data.forEach(function (m) {
        const row = document.createElement("div");
        row.className = "row " + (m.who === "me" ? "me" : "ta");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.text || "";
        const t = document.createElement("div");
        t.className = "mtime";
        t.textContent = m.time ? m.time.slice(11, 16) : "";
        row.appendChild(bubble);
        row.appendChild(t);
        body.appendChild(row);
      });
      if (last) body.scrollTop = body.scrollHeight;
    } catch (e) {
      document.getElementById("chatBody").innerHTML = '<div class="empty">加载失败，检查网络后刷新</div>';
    }
  }

  async function sendChat() {
    const input = document.getElementById("chatText");
    const text = input.value.trim();
    if (!text) return;
    try {
      const { error } = await sb.from("chat").insert({ who: "ta", text: text, time: now() });
      if (error) {
        alert("发送失败：" + (error.message || "未知原因"));
        return;
      }
      input.value = "";
      await loadChat();
      const body = document.getElementById("chatBody");
      body.scrollTop = body.scrollHeight;
    } catch (e) {
      alert("发送失败，检查网络");
    }
  }

  // 表情选择（微信同款：点表情插入输入框）
  const EMOJIS = ["😀","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥳","😏","😒","😞","😔","😟","😕","🙁","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥","😶","😐","😑","😬","🙄","😯","😦","😮","😲","🥱","😴","🤤","😪","😵","🤐","🤢","🤮","🤧","😷","🤒","🤕","🤠","😈","👿","👻","💩","👽","🤖","😺","😸","😻","😼","😽","🙀","❤️","🧡","💛","💚","💙","💜","🖤","🤍","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","💌","💋","💯","✨","🌟","⭐","🌈","☁️","⚡","🔥","💥","🌹","🥀","🌺","🌸","🌼","🌻","🍀","🍁","🍄","🌵","🎈","🎉","🎊","🎀","🎁","🏆","🥇","🥈","🥉","🎯","🎮","🎲","🎨","👍","👎","👌","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","👇","☝️","✋","🤚","🖐️","🖖","👋","🤛","🤜","✊","👊","🙌","🙏","👏","🤝","💪","🫶","🫰","🫡","🐱","🐶","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧","🐦","🐤","🐣","🦄","🐝","🦋","🐌","🐞","🐢","🐙","🦑","🐟","🐬","🐳","🦈","🐊","🦓","🦒","🐘","🐪","🦘","🐎","🐖","🐏","🦙","🐐","🦌","🐕","🐩","🐈","🦩","🕊️","🌍","🌎","🌏","🗺️","🏠","🏡","🌃","🌅","🌄","🌉","🎡","🎢","🎠","⛲","⚽","🏀","🏈","⚾","🎾","🏐","🏉","🎱","🏓","🏸","🥅","🎣","🎽","🎿","🛷","🥌","🎯","🎳","⛳","🎰","🚗","🚕","🚙","🚌","🚎","🏎️","🚓","🚑","🚒","🚐","🚚","🚛","🚜","🛴","🚲","🛵","🏍️","🚨","🚔","🚍","🚘","🚖","✈️","🛫","🛬","🛩️","💺","🚀","🛸","🚁","⛵","🚤","🛥️","🛳️","⛴️","🚢","⚓","🧭","📱","💻","⌨️","🖥️","🖨️","💽","💾","💿","📀","📷","📸","📹","🎥","📽️","📞","☎️","📟","📠","📺","📻","🔋","🔌","💡","🔦","🕯️","💸","💵","💴","💶","💷","💰","💳","💎","⚖️","🔧","🔨","⚒️","🔩","⚙️","🧱","🔫","🔪","🗡️","⚔️","🛡️","🏺","🔮","📿","💊","💉","🩺","🌡️","🧹","🧺","🧻","🧼","🪒","🧽","🧲","🎁","🕶️","🎧","👑","🎩","🎓","🧢","👟","👞","👠","👡","👢","👕","👔","🧥","👗","👘","👙","🩱","🩲","🩳","🧦","🧤","🧣","👜","👝","👛","🛍️","🎒","👓","🐚","🐡","🐠","🐟","🐬","🐳","🐋","🦈","🦭","🐊","🐢","🦎","🐍","🐲","🐉","🦕","🦖","🦗","🕷️","🕸️","🦂","🦟","🪰","🪲","🦠","🦴","🦷","👀","👁️","👃","👂","👅","👄","💅","🤳","👱","👲","🧓","👴","👵","👶","👧","👦","👩","👨","👩‍🦰","👨‍🦰","👩‍🦱","👨‍🦱","👩‍🦳","👨‍🦳","👩‍🦲","👨‍🦲","🧔","🧕","👳","👮","🕵️","💂","👷","🤴","👸","👰","🤵","🤰","🤱","👼","🎅","🤶","🦸","🦹","🧙","🧚","🧛","🧜","🧝","🧞","🧟","💃","🕺","👯","🧖","🧗","🤺","🏇","⛷️","🏂","🏌️","🏄","🚣","🏊","⛹️","🏋️","🚴","🚵","🤸","🤼","🤽","🤾","🤹","🧘","🛀","🛌","👭","👫","👬","💑","👩‍❤️‍👨","💏","👪","🗣️","👤","👥","⚡","☀️","🌙","☁️","⛅","🌧️","⛈️","🌩️","❄️","🌨️","🌬️","💨","🌪️","🌫️","🌊","☔","☂️","🌂","🍏","🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍈","🍒","🍑","🥭","🍍","🥥","🥝","🍅","🍆","🥑","🥦","🥬","🥒","🌶️","🫑","🌽","🥕","🫒","🧄","🧅","🥔","🍠","🥐","🥯","🍞","🥖","🥨","🧀","🥚","🍳","🧈","🥞","🧇","🥓","🥩","🍗","🍖","🦴","🌭","🍔","🍟","🍕","🫓","🥪","🥙","🧆","🌮","🌯","🫔","🥗","🥘","🫕","🥫","🍝","🍜","🍲","🍛","🍣","🍱","🥟","🦪","🍤","🍙","🍚","🍘","🍥","🥠","🥮","🍢","🍡","🍧","🍨","🍦","🥧","🧁","🍰","🎂","🍮","🍭","🍬","🍫","🍿","🍩","🍪","🌰","🥜","🍯","🥛","🍼","☕","🫖","🍵","🧋","🍶","🍺","🍻","🥂","🍷","🥃","🍸","🍹","🧉","🍾","🧊","🥄","🍴","🍽️","🥣","🥡","🥢","🧂","🎂","🎉","🎊","🎈","🎁","🎀","🪅","🪆","🪡","🧵","🧶","🪢","🪝","🪚","🪛","🪤","🪧","🪞","🪟","🪑","🛋️","🛏️","🚪","🛗","🪜","🪑","🧱","🪨","🪵","🧊","🪴","🌾","🌿","☘️","🍀","🍃","🍂","🍁","🌱","🌲","🌳","🌴","🌵","🌷","🌸","🌹","🥀","🌺","🌻","🌼","🌽","🌾","🌿","🍄","🍁","🍂","🍃","🌊","💧","🍎","🍊","🍋","🍒","🍇","🍉","🍓","🍑","🍍","🥭","🥝","🍅","🥑","🍆","🥔","🥕","🌽","🌶️","🥦","🥬","🥒","🥗","🍱","🍣","🍜","🍝","🍛","🍲","🍚","🍙","🍘","🥟","🍤","🍡","🍧","🍨","🍦","🍰","🎂","🧁","🍮","🍭","🍬","🍫","🍿","🍩","🍪","🥛","🍼","☕","🍵","🍶","🍺","🍻","🥂","🍷","🥃","🍸","🍹","🧉","🍾","🧊"];

  function buildEmojiPanel() {
    const grid = document.getElementById("emojiGrid");
    if (!grid) return;
    EMOJIS.forEach(function (e) {
      const b = document.createElement("button");
      b.className = "emoji-item";
      b.textContent = e;
      b.type = "button";
      b.onclick = function () { insertEmoji(e); };
      grid.appendChild(b);
    });
  }

  function toggleEmoji(ev) {
    ev.stopPropagation();
    document.getElementById("emojiPanel").classList.toggle("show");
  }

  function insertEmoji(e) {
    const input = document.getElementById("chatText");
    const start = input.selectionStart || input.value.length;
    const end = input.selectionEnd || input.value.length;
    input.value = input.value.slice(0, start) + e + input.value.slice(end);
    const pos = start + e.length;
    input.setSelectionRange(pos, pos);
    input.focus();
  }

  // 点面板外面关闭表情面板
  document.addEventListener("click", function (e) {
    const p = document.getElementById("emojiPanel");
    if (p && !e.target.closest(".emoji-btn") && !e.target.closest(".emoji-panel")) {
      p.classList.remove("show");
    }
  });

  // 回车发送
  document.getElementById("chatText").addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendChat();
  });

  buildEmojiPanel();
  loadChat();
  // 每 5 秒刷新一次，看有没有新消息
  setInterval(loadChat, 5000);
</script>
</body>
</html>
